<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 반 갤러리</title>
  <style>
    :root {
      --blue-900: #0b2a5b;
      --blue-700: #1d4ed8;
      --blue-500: #3b82f6;
      --blue-200: #bfdbfe;
      --blue-50:  #eff6ff;
      --text: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: var(--blue-50);
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
      color: #fff;
      text-align: center;
      padding: 56px 20px 48px;
    }
    header h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    header p  { margin: 0; font-size: clamp(1rem, 2.5vw, 1.15rem); color: var(--blue-200); }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      background: #fff;
      border: 1px solid var(--blue-200);
      border-top: 6px solid var(--blue-500);
      border-radius: 14px;
      padding: 22px 20px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(29, 78, 216, .18);
      outline: none;
    }
    .num {
      display: inline-block;
      background: var(--blue-700);
      color: #fff;
      font-size: .8rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .card h2 { margin: 12px 0 6px; font-size: 1.15rem; color: var(--blue-900); }
    .card p  { margin: 0 0 14px; font-size: .95rem; color: #475569; }
    .open    { font-size: .9rem; font-weight: bold; color: var(--blue-700); }
    footer {
      text-align: center;
      padding: 20px;
      font-size: .85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>우리 반 갤러리</h1>
    <p>수행평가로 만든 데이터 분석 보고서를 모았어요.</p>
  </header>

  <main>
    <div class="grid">
      <a class="card" href="pdf/ict-export-flourish-visualization.pdf" target="_blank" rel="noopener">
        <span class="num">작품 1</span>
        <h2>숫자로 보는 ICT 수출 20년</h2>
        <p>Flourish로 반도체·디스플레이 등 수출액 변화를 보여 준 보고서</p>
        <span class="open">PDF 열기 →</span>
      </a>

      <a class="card" href="pdf/game-industry-linear-regression-orange3.pdf" target="_blank" rel="noopener">
        <span class="num">작품 2</span>
        <h2>종사자가 늘면 매출도 늘까? 게임 산업 회귀 탐구</h2>
        <p>Orange3로 종사자 수와 매출액의 관계를 예측한 보고서</p>
        <span class="open">PDF 열기 →</span>
      </a>

      <a class="card" href="pdf/pokemon-type-stats-codap-report.pdf" target="_blank" rel="noopener">
        <span class="num">작품 3</span>
        <h2>타입마다 뭐가 다를까? 포켓몬 능력치 분석</h2>
        <p>CODAP으로 타입에 따른 스탯 차이를 분석한 보고서</p>
        <span class="open">PDF 열기 →</span>
      </a>
    </div>
  </main>

  <footer>© 우리 반 갤러리</footer>
</body>
</html>
